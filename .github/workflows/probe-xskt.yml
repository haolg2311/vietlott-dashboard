name: Lấy lịch sử Lotto
on:
  push:
    branches: [probe-xskt]
    paths: [".github/workflows/probe-xskt.yml"]
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/backfill_lotto.py 2025-06-29 2026-08-16 | tee backfill_log.txt
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add data/lotto_history.json backfill_log.txt; git commit -q -m "Lịch sử Lotto"; git push -q origin probe-xskt
