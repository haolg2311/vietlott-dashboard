name: Cập nhật số liệu
on:
  schedule:
    - cron: "30 0 * * *"   # 07:30 giờ Việt Nam
    - cron: "45 6 * * *"   # 13:45
    - cron: "20 12 * * *"  # 19:20
    - cron: "50 14 * * *"  # 21:50
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/update.yml", "scripts/fetch_results.py"]
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q scipy
      - name: Xóa nhánh thử
        run: git push origin --delete probe probe-results || true
      - name: Tải dãy số mới nhất
        run: python scripts/build.py
      - name: Lấy jackpot và số giải
        run: python scripts/fetch_results.py
      - name: Tính lại
        run: python scripts/build.py --no-fetch
      - name: Đẩy lên main
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "Tự cập nhật số liệu $(TZ=Asia/Ho_Chi_Minh date +'%d/%m %H:%M')"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin main && git push -q origin main && exit 0
            sleep 15
          done
          exit 1
