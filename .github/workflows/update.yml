name: Cập nhật số liệu
on:
  schedule:
    - cron: "37 1-23/2 * * *"   # phút 37 các giờ chẵn theo giờ Việt Nam, GitHub có thể chạy trễ
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/update.yml", "scripts/fetch_results.py"]
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q scipy
      - name: Tải dãy số mới nhất
        run: python scripts/build.py
      - name: Lấy jackpot và số giải
        run: python scripts/fetch_results.py
      - name: Tính lại
        run: python scripts/build.py --no-fetch
      - name: Đẩy lên main
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          today=$(TZ=Asia/Ho_Chi_Minh date +%Y%m%d)
          last=$(TZ=Asia/Ho_Chi_Minh git log -1 --format=%cd --date=format-local:%Y%m%d)
          if git diff --quiet -- data/jackpots.json data/lotto.json data/raw data/commentary.json && [ "$today" = "$last" ]; then
            echo "Không có số liệu mới"
            exit 0
          fi
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "Tự cập nhật số liệu $(TZ=Asia/Ho_Chi_Minh date +'%d/%m %H:%M')"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin main && git push -q origin main && exit 0
            sleep 15
          done
          exit 1
