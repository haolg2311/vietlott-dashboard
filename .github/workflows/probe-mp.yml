name: Lấy lịch sử Mega Power
on:
  push:
    branches: [probe-mp]
    paths: [".github/workflows/probe-mp.yml"]
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      max-parallel: 1
      matrix:
        include:
          - {game: mega, lo: 198, hi: 1600}
          - {game: power, lo: 1, hi: 1500}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/backfill_mp.py ${{ matrix.game }} ${{ matrix.lo }} ${{ matrix.hi }} | tee log_${{ matrix.game }}.txt
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add data/${{ matrix.game }}_history.json log_${{ matrix.game }}.txt; git commit -q -m "Lịch sử ${{ matrix.game }}"
          for i in 1 2 3; do git pull -q --rebase origin probe-mp && git push -q origin probe-mp && exit 0; sleep 10; done; exit 1
